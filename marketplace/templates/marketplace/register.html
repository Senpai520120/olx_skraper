{% extends 'marketplace/base.html' %}

{% block title %}Реєстрація{% endblock %}

{% block content %}

<div class="auth-wrap">
    <h1>Реєстрація</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зареєструватися</button>
    </form>
    <p>Вже є акаунт? <a href="{% url 'marketplace:login' %}">Увійти</a></p>
</div>

{% endblock %}
