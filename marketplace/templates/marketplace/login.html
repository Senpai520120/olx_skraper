{% extends 'marketplace/base.html' %}

{% block title %}Вхід{% endblock %}

{% block content %}

<div class="auth-wrap">
    <h1>Вхід</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Увійти</button>
    </form>
    <p>Немає акаунту? <a href="{% url 'marketplace:register' %}">Зареєструватися</a></p>
</div>

{% endblock %}
