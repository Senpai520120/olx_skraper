{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marketplace{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'marketplace/css/style.css' %}">
</head>
<body>

<header>
    <div class="header-inner">
        <a href="{% url 'marketplace:home' %}" class="logo">Marketplace</a>

        <div class="nav">
            {% if user.is_authenticated %}
                <a href="{% url 'marketplace:product_create' %}" class="btn btn-blue">+ Створити</a>
                <span class="username">{{ user.username }}</span>
                <a href="{% url 'marketplace:logout' %}">Вихід</a>
            {% else %}
                <a href="{% url 'marketplace:login' %}">Увійти</a>
                <a href="{% url 'marketplace:register' %}" class="btn btn-blue">Реєстрація</a>
            {% endif %}
        </div>
    </div>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
